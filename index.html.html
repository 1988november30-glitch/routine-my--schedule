        .container { max-width: 600px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); }

        .status-card .location { font-size: 24px; font-weight: 700; line-height: 1.4; }
        .routine-toggle { background: #3498db; color: white; border: none; padding: 10px 20px; font-size: 15px; border-radius: 6px; cursor: pointer; transition: 0.2s; }

        .routine-table { display: none; margin-top: 20px; text-align: left; }
        .day-title { font-weight: bold; color: #2c3e50; margin-top: 15px; margin-bottom: 5px; border-bottom: 2px solid #3498db; padding-bottom: 3px; }

    </style>

const dayMapBn = {
    "Sunday": "রবিবার",
    "Monday": "সোমবার",
    "Tuesday": "মঙ্গলবার",
    "Wednesday": "বুধবার",
    "Thursday": "বৃহস্পতিবার",
    "Friday": "শুক্রবার",
    "Saturday": "শনিবার"
};

function updateStatus() {
    const now = new Date();
    const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const currentDay = days[now.getDay()];
    
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const currentTimeStr = `${hours}:${minutes}`;

    document.getElementById("liveClock").innerText = `${dayMapBn[currentDay] || currentDay}, সময়: ${now.toLocaleTimeString('bn-BD')}`;

    const todaySchedule = schedule[currentDay];
    let currentTask = "বর্তমানে কোনো নির্ধারিত ক্লাস বা প্রাতিষ্ঠানিক কাজ নেই।";

    if (todaySchedule) {
        for (let item of todaySchedule) {
            if (currentTimeStr >= item.start && currentTimeStr <= item.end) {
                currentTask = item.text;
                break;
            }
        }
    } else {
        currentTask = "আজ সাপ্তাহিক ছুটি / কোনো ক্লাস নেই।";
    }

    document.getElementById("currentLocation").innerText = currentTask;
}

function renderFullRoutine() {
    const container = document.getElementById("routineDetails");
    let html = "";
    for (let day in schedule) {
        html += `<div class="day-title">${dayMapBn[day]}</div><ul>`;
        schedule[day].forEach(item => {
            html += `<li><b>${item.start} - ${item.end}:</b> ${item.text}</li>`;
        });
        html += `</ul>`;
    }
    container.innerHTML = html;
}

function toggleRoutine() {
    const el = document.getElementById("routineDetails");
    el.style.display = (el.style.display === "block") ? "none" : "block";
}

setInterval(updateStatus, 1000);
updateStatus();
renderFullRoutine();
